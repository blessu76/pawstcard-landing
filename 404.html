<style>
  :root{--paper:#F4F7F1;--ink:#1E2B23;--forest:#2E5941;--forest-deep:#22402F;--ball:#C9D32B;--muted:#5C6B60;--line:#DDE5DB}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;width:100%}
  header{padding:22px 0}
  .logo{font-family:'Fraunces',serif;font-weight:700;font-size:1.35rem;color:var(--forest-deep);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
  .logo .paw{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--ball);align-items:center;justify-content:center;font-size:15px}
  main{flex:1;display:flex;align-items:center}
  .box{padding:48px 0 72px;max-width:560px}
  .code{font-size:.9rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--forest)}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.15;color:var(--forest-deep);margin:10px 0 14px}
  p{color:var(--muted);font-size:1.05rem}
  .links{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
  .btn{display:inline-block;background:var(--forest);color:#fff;font-weight:600;border-radius:999px;padding:13px 26px;text-decoration:none;transition:background .2s}
  .btn:hover,.btn:focus-visible{background:var(--forest-deep)}
  .btn.alt{background:transparent;color:var(--forest-deep);border:1.5px solid var(--forest);padding:11.5px 24.5px}
  .btn.alt:hover,.btn.alt:focus-visible{background:#EDF3E8}
  footer{padding:24px 0;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line)}
  footer a{color:var(--forest-deep)}
